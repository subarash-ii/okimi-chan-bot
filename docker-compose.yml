services:
  app:
    build: .
    container_name: okimi-chan
    env_file: .env
    restart: always
    environment:
      - NODE_ENV=production
      - DB_URI=mongodb://mongo:27017/okimi-chan
    volumes:
      - ./logs:/app/logs
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:8
    container_name: okimi-chan-db
    restart: always
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mongo_data:
